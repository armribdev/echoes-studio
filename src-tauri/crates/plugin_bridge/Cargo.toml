[package]
name = "plugin_bridge"
version = "0.1.0"
edition = "2021"
description = "Shared transport core (shmem ring + wire protocol) for the out-of-process plugin sandbox — ADR-015."
license = "MIT"
publish = false

# Cross-platform code is std-only: this crate defines the cross-process ABI
# shared by the engine (`echoes-studio`) and the bridge host
# (`plugin_host_bridge`).  Keep the trusted surface of the real-time transport
# minimal — add dependencies only when an ADR requires them.
[dependencies]

# Win32 file-mapping APIs for `region::SharedRegion` (ADR-015 6d-i).  Same
# version the engine already pins, so no extra resolution.
[target.'cfg(windows)'.dependencies]
# `Win32_Security` is required because `CreateFileMappingW`'s signature
# references `SECURITY_ATTRIBUTES` (we pass null), so windows-sys only exposes the
# function when that feature is enabled.
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
