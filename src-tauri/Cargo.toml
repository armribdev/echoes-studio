[package]
name = "echoes-studio"
version = "0.1.0"
description = "A radically simple open-source DAW"
authors = ["Armand Ribault"]
license = "MIT"
repository = "https://github.com/echoes-studio/echoes-studio"
default-run = "echoes-studio"
edition = "2021"
rust-version = "1.77.2"

# Workspace rooted at this crate (ADR-015, Phase 6c-ii).  Rooting here — rather
# than at the repo root — keeps the build artifact directory at `src-tauri/target`,
# so the existing Tauri build/dev flow and tooling scripts are unaffected.
# `resolver = "2"` is the implicit default for a standalone edition-2021 crate;
# stating it explicitly preserves the exact feature resolution → the engine binary
# stays bit-identical (C-2).
[workspace]
members = ["crates/audio_buffer", "crates/clap_ffi", "crates/plugin_bridge", "crates/plugin_host_bridge", "crates/plugin_param_queue", "crates/test_clap_plugin", "crates/test_vst3_plugin", "crates/vst3_ffi", "crates/vst3_host"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# Shared transport core for the out-of-process plugin sandbox (ADR-015).  The
# engine links it to reuse the same shmem-ring + wire-protocol ABI the bridge
# host (`plugin_host_bridge`) speaks.  std-only, no transitive deps.
plugin_bridge = { path = "crates/plugin_bridge" }
# CLAP C-ABI bindings, shared with the bridge host (ADR-015 6d-iii-b-2).  The
# engine's `plugin_formats::clap::ffi` re-exports this crate.
clap_ffi = { path = "crates/clap_ffi" }
# VST3 COM bindings and the parameter queue, shared with the bridge host
# (ADR-033, step 1).  The engine re-exports them from the old module paths.
vst3_ffi = { path = "crates/vst3_ffi" }
vst3_host = { path = "crates/vst3_host" }
audio_buffer = { path = "crates/audio_buffer" }
plugin_param_queue = { path = "crates/plugin_param_queue" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
hound = "3.5.1"
cpal = "0.15.2"
# Hardware MIDI input (ADR-022). Owns its own capture thread per open device;
# we never spawn or manage that thread ourselves.
midir = "0.10"
symphonia = { version = "0.5", default-features = false, features = [
    "wav", "mp3", "flac", "ogg",
    "pcm", "adpcm", "vorbis",
] }
mp3lame-encoder = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_Security", "Win32_System_Com", "Win32_UI_Shell"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
# Unfinished plugin formats (stubs only). Off by default; they never touch the render path (C-10).
au = []
wasm = []

[dev-dependencies]
vst3_ffi = { path = "crates/vst3_ffi", features = ["test-support"] }
audio_buffer = { path = "crates/audio_buffer", features = ["test-support"] }
test_vst3_plugin = { path = "crates/test_vst3_plugin" }
vst3_host = { path = "crates/vst3_host", features = ["test-support"] }
