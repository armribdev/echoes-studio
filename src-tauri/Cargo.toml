[package]
name = "echoes-studio"
version = "0.1.0"
description = "A radically simple open-source DAW"
authors = ["Armand Ribault"]
license = "MIT"
repository = "https://github.com/echoes-studio/echoes-studio"
default-run = "echoes-studio"
edition = "2021"
rust-version = "1.60"

# Workspace rooted at this crate (ADR-015, Phase 6c-ii).  Rooting here — rather
# than at the repo root — keeps the build artifact directory at `src-tauri/target`,
# so the existing Tauri build/dev flow and tooling scripts are unaffected.
# `resolver = "2"` is the implicit default for a standalone edition-2021 crate;
# stating it explicitly preserves the exact feature resolution → the engine binary
# stays bit-identical (C-2).
[workspace]
members = ["crates/clap_ffi", "crates/plugin_bridge", "crates/plugin_host_bridge"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Shared transport core for the out-of-process plugin sandbox (ADR-015).  The
# engine links it to reuse the same shmem-ring + wire-protocol ABI the bridge
# host (`plugin_host_bridge`) speaks.  std-only, no transitive deps.
plugin_bridge = { path = "crates/plugin_bridge" }
# CLAP C-ABI bindings, shared with the bridge host (ADR-015 6d-iii-b-2).  The
# engine's `plugin_formats::clap::ffi` re-exports this crate.
clap_ffi = { path = "crates/clap_ffi" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
hound = "3.5.1"
cpal = "0.15.2"
symphonia = { version = "0.5", default-features = false, features = [
    "wav", "mp3", "flac", "ogg",
    "pcm", "adpcm", "vorbis",
] }
mp3lame-encoder = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
